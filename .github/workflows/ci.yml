name: VeriCred Midnight CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Root & Workspace Dependencies
        run: |
          npm install --no-audit
          npm --prefix contract install --no-audit
          npm --prefix api install --no-audit
          npm --prefix vericred-cli install --no-audit
          npm --prefix vericred-ui install --no-audit

      - name: Compile Compact Contracts & Build Core Libraries
        run: |
          npm --prefix contract run compact || true
          npm --prefix contract run build
          npm --prefix api run build

      - name: Typecheck TypeScript Codebases
        run: |
          npm run typecheck

      - name: Execute Smart Contract Unit Tests
        run: |
          npm test

      - name: Build Application Packages
        run: |
          npm run build
