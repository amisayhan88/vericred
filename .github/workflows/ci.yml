name: VeriCred CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Typecheck · Lint · Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm install --no-audit

      - name: Typecheck (contract · api · cli · ui)
        run: npm run typecheck

      - name: Lint UI
        run: npm --prefix vericred-ui run lint

      - name: Contract unit tests (vitest)
        run: npm test

  build:
    name: Build (frontend bundle)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm install --no-audit

      - name: Build workspaces (contract → api → cli → ui)
        run: npm run build

      - name: Build Preview-mode bundle (Vercel artifact)
        run: npm run build:vercel

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: vericred-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
